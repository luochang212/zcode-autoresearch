<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="zcode-autoresearch logo — a lightning bolt inside a loop arrow, symbolising fast autonomous experiment cycles">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2126"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F6DC8E"/>
      <stop offset="1" stop-color="#E0A93E"/>
    </linearGradient>
  </defs>

  <!-- dark zcode-style tile -->
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>

  <!-- thin loop arrow: the experiment cycle, tight gap at 3 o'clock -->
  <path d="M 190.8 148.4 A 66 66 0 1 1 190.8 107.6" fill="none" stroke="#B9BFC9" stroke-width="11" stroke-linecap="round"/>
  <path d="M 196.3 124.7 L 179.2 109.3 L 201.1 102.1 Z" fill="#B9BFC9"/>

  <!-- lightning bolt: speed of iteration, breathing room from the ring -->
  <polygon points="143,79 103,137 125,137 117,177 160,119 136,119" fill="url(#gold)"/>
</svg>
