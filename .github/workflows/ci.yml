name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A force-pushed head cannot produce a green run for the rewritten commit;
  # dispatch re-runs CI on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a supported user platform: bash resolution, taskkill and
        # path normalization have their own branches, unreachable on Linux.
        os: [ubuntu-latest, windows-latest]
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npx adrkit validate
      - run: npx openspec validate --specs --strict
      - run: npm test
