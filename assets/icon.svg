<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="zcode plugin marketplace logo — a sailboat on lemon yellow, symbolising free exploration">
  <defs>
    <linearGradient id="lemon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF34D"/>
      <stop offset="1" stop-color="#F7D533"/>
    </linearGradient>
    <linearGradient id="sailMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BDE5EA"/>
    </linearGradient>
    <linearGradient id="sailJib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF4F6"/>
      <stop offset="1" stop-color="#A3D2DF"/>
    </linearGradient>
  </defs>

  <!-- lemon-yellow tile -->
  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#lemon)" stroke="#EEC22A" stroke-width="4"/>

  <!-- seagull — pushed out to the right, well clear of the boat -->
  <path d="M188 70 c 7 -9 13 -9 20 0 c 7 -9 13 -9 20 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- the boat — full size, nudged slightly left; overall composition stays centred -->
  <g transform="translate(-12 0)">
    <!-- jib (headsail) -->
    <path d="M128 78 L 70 156 L 128 156 Z" fill="url(#sailJib)"/>

    <!-- main sail -->
    <path d="M128 64 C 176 90 192 122 192 156 L 128 156 Z" fill="url(#sailMain)"/>

    <!-- mast -->
    <line x1="128" y1="58" x2="128" y2="182" stroke="#12303F" stroke-width="9" stroke-linecap="round"/>

    <!-- hull -->
    <path d="M50 174 H 206 C 196 202 162 214 128 214 C 94 214 58 202 50 174 Z" fill="#12303F"/>
  </g>

  <!-- the sea — two waves, deliberately staggered so the frame feels layered and big -->
  <path d="M36 228 q 16 -9 32 0 q 16 9 32 0 q 16 -9 32 0 q 16 9 32 0 q 16 -9 32 0" fill="none" stroke="#F2C416" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M88 240 q 12 -7 24 0 q 12 7 24 0 q 12 -7 24 0 q 12 7 24 0" fill="none" stroke="#F2C416" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
</svg>
